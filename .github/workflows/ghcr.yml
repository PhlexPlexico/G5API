name: Publish to GHCR
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      # Release tags, e.g. V2.3.0.0. The leading V is stripped from image tags.
      - '[Vv][0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[Vv][0-9]+.[0-9]+.[0-9]+'
jobs:
  push:
    name: Create build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      # packages: publish the image. contents: create the release on a tag.
      packages: write
      contents: write
    strategy:
      fail-fast: false
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2.1.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.2.1
        with:
          buildkitd-flags: --debug
      - id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}
      - uses: actions/checkout@v3.3.0
      - uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Release version comes from the tag itself, so the image tag can never
      # drift from the ref that produced it.
      - id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "number=${GITHUB_REF_NAME#[Vv]}" >> "$GITHUB_OUTPUT"
      # Every push to master publishes :next -- the rolling build, which is
      # master plus whatever dependency and security updates have landed.
      - name: Push :next (master)
        uses: docker/build-push-action@v3.2.0
        if: github.ref == 'refs/heads/master'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5api:next
      # A release tag publishes the version and moves :latest onto it.
      - name: Push :latest and :<version> (tag)
        uses: docker/build-push-action@v3.2.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5api:latest,ghcr.io/${{ steps.string.outputs.lowercase }}/g5api:${{ steps.version.outputs.number }}
      # Pull this version's section out of CHANGELOG.md to use as release notes.
      # Runs after the image push so a failed build never produces a release.
      - name: Extract release notes from CHANGELOG
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.number }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## / { exit }
            flag && /^\[.*\]: http/ { next }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for $VERSION:"
            cat release-notes.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md; \
              falling back to auto-generated notes."
          fi
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
